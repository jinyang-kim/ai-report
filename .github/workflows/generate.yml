name: Generate Reports

on:
  schedule:
    # cron 은 UTC. 아침 창(KST 09:15~12:15)에서 20분 간격 10회 발화한다.
    # 각 실행이 '오늘(KST) 발행 예정(due) 중 아직 파일이 없는 첫 카테고리 하나'를 생성한다(멱등 catch-up).
    # GitHub 예약 스케줄은 best-effort 라 지연·드롭될 수 있으므로, 창 안에서 반복 시도해 누락을 메운다.
    # 미니트는 정각(:00, 전역 데일리 잡이 몰리는 최대 혼잡)을 피해 :15/:35/:55 로 둬 지연을 줄인다.
    # 요일별 빈도 차등(매일/격일/주간) 판정은 cron 이 아니라 아래 Resolve 잡 안에서 계산한다.
    - cron: "15 0 * * 1-5"   # 09:15 KST
    - cron: "35 0 * * 1-5"   # 09:35 KST
    - cron: "55 0 * * 1-5"   # 09:55 KST
    - cron: "15 1 * * 1-5"   # 10:15 KST
    - cron: "35 1 * * 1-5"   # 10:35 KST
    - cron: "55 1 * * 1-5"   # 10:55 KST
    - cron: "15 2 * * 1-5"   # 11:15 KST
    - cron: "35 2 * * 1-5"   # 11:35 KST
    - cron: "55 2 * * 1-5"   # 11:55 KST
    - cron: "15 3 * * 1-5"   # 12:15 KST
  workflow_dispatch:
    inputs:
      category:
        description: "특정 카테고리 강제 (비우면 오늘 due 중 아직 없는 것을 자동 선택)"
        required: false
      date:
        description: "YYYY-MM-DD (비우면 오늘 KST)"
        required: false

# push 경합 방지: 그룹 내 1개만 실행, 나머지는 큐잉
concurrency:
  group: generate-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve category and date
        id: ctx
        run: |
          # 날짜: 입력 없으면 오늘 KST
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Asia/Seoul date +%F)"; fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "잘못된 date 형식: '$DATE' (YYYY-MM-DD 필요)"; exit 1
          fi

          CATEGORY="${{ github.event.inputs.category }}"
          if [ -z "$CATEGORY" ]; then
            # 오늘(KST) 발행 예정(due) 카테고리 — 요일별 빈도 차등
            DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 .. 7=일
            DUE="kr-daily it-ai finance"     # 매일(평일)
            case "$DOW" in
              1|3|5) DUE="$DUE global-ui-ux electronics gaming mobility" ;;  # 격일 월수금
            esac
            if [ "$DOW" = "2" ]; then DUE="$DUE health"; fi        # 주간 화
            if [ "$DOW" = "4" ]; then DUE="$DUE food-travel"; fi   # 주간 목
            if [ "$DOW" = "5" ]; then DUE="$DUE education"; fi     # 주간 금

            # due 중 아직 파일이 없는 첫 카테고리 선택
            PICK=""
            for c in $DUE; do
              if [ ! -f "src/content/$c/$DATE.md" ]; then PICK="$c"; break; fi
            done
            if [ -z "$PICK" ]; then
              echo "오늘($DATE) due 리포트가 모두 존재 → 생성할 것 없음(skip)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CATEGORY="$PICK"
          fi

          case "$CATEGORY" in
            kr-daily|it-ai|global-ui-ux|electronics|health|food-travel|gaming|education|finance|mobility) ;;
            *) echo "잘못된 category: '$CATEGORY'"; exit 1 ;;
          esac
          echo "선택된 카테고리: $CATEGORY (날짜 $DATE)"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "file=src/content/$CATEGORY/$DATE.md" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Skip if report already exists
        id: exists
        if: steps.ctx.outputs.skip == 'false'
        run: |
          if [ -f "${{ steps.ctx.outputs.file }}" ]; then
            echo "이미 존재 → skip: ${{ steps.ctx.outputs.file }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate report with Claude Code
        if: steps.exists.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            오늘(KST ${{ steps.ctx.outputs.date }})의 "${{ steps.ctx.outputs.category }}" 리포트를 생성한다.
            1. .github/prompts/${{ steps.ctx.outputs.category }}.md 를 Read 하고 그 지침을 따른다.
            2. src/content.config.ts 를 Read 해 프론트매터 스키마를 확인한다.
            3. WebSearch/WebFetch 로 조사한다.
            4. 완성된 마크다운을 정확히 이 경로에 Write 한다: ${{ steps.ctx.outputs.file }}
               - 프론트매터 date 는 ${{ steps.ctx.outputs.date }} 이고 파일명과 일치해야 한다.
               - generatedBy: claude-code, generatedAt: "${{ steps.ctx.outputs.date }}T09:00:00+09:00"
            git 명령은 실행하지 않는다. 파일 생성만 한다.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Verify file was created
        if: steps.exists.outputs.skip == 'false'
        run: test -f "${{ steps.ctx.outputs.file }}" || { echo "Claude 가 파일을 만들지 않음"; exit 1; }

      - name: Setup Node
        if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate with build gate
        if: steps.exists.outputs.skip == 'false'
        run: |
          npm ci
          npm run build

      - name: Quality gate (본문·출처·핵심 검사)
        if: steps.exists.outputs.skip == 'false'
        run: python3 scripts/quality-check.py "${{ steps.ctx.outputs.file }}"

      - name: Commit and push
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ai-report-bot"
          git config user.email "sunlover011@gmail.com"
          # Claude Code Action 이 원격 인증을 App 설치 토큰으로 바꾼 뒤 스텝 종료 시 revoke 하므로,
          # 워크플로 GITHUB_TOKEN 으로 원격 URL 을 명시 재설정한다 (contents:write 권한).
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add "${{ steps.ctx.outputs.file }}"
          git commit -m "[${{ steps.ctx.outputs.category }}] ${{ steps.ctx.outputs.date }} 자동 생성"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git fetch origin main
            git rebase origin/main
          done
          echo "3회 재시도 후 push 실패"; exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const cat = '${{ steps.ctx.outputs.category }}' || '(unknown)';
            const date = '${{ steps.ctx.outputs.date }}' || '(unknown)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[생성 실패] ${cat} ${date}`;
            // 같은 제목의 열린 이슈가 있으면 중복 생성하지 않음
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cron-failure',
            });
            if (existing.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              body: `카테고리: ${cat}\n날짜(KST): ${date}\n로그: ${runUrl}`,
              labels: ['cron-failure'],
            });

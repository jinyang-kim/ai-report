name: Generate Reports

on:
  schedule:
    # cron 은 UTC. 두 개의 catch-up 창으로 나눈다. 각 발화 = '이 창의 오늘 due 중 아직 파일이 없는
    # 첫 카테고리 하나'를 생성(멱등). GitHub 예약은 best-effort 라 지연·드롭되므로 창 안에서 반복 시도한다.
    # window 판정은 Resolve 스텝이 cron 의 UTC '시(hour)' 로 한다(지연에 견고 — run-time 시각이 아님).
    #
    # ── 아침 창 (finance 제외 전부): UTC 17:10~20:10 = KST 02:10~05:10, 20분 간격 10회, 매일 발화.
    #    KST 07시 기상/09시 출근 전 완료가 목표(단 GitHub 지연이 크면 밀릴 수 있음).
    #    저녁 UTC 라 자정 UTC 피크보다 지연이 작은 편. 주말(토·일)엔 food-travel 만 due.
    - cron: "10 17 * * *"
    - cron: "30 17 * * *"
    - cron: "50 17 * * *"
    - cron: "10 18 * * *"
    - cron: "30 18 * * *"
    - cron: "50 18 * * *"
    - cron: "10 19 * * *"
    - cron: "30 19 * * *"
    - cron: "50 19 * * *"
    - cron: "10 20 * * *"
    # ── 오후 창 (finance 만 — 장 마감 후 수치): UTC 06:35~08:05 = KST 15:35~17:05, 평일만 4회.
    - cron: "35 6 * * 1-5"
    - cron: "5 7 * * 1-5"
    - cron: "35 7 * * 1-5"
    - cron: "5 8 * * 1-5"
  workflow_dispatch:
    inputs:
      category:
        description: "특정 카테고리 강제 (비우면 오늘 due 중 아직 없는 것을 자동 선택)"
        required: false
      date:
        description: "YYYY-MM-DD (비우면 오늘 KST)"
        required: false

# push 경합 방지: 그룹 내 1개만 실행, 나머지는 큐잉
concurrency:
  group: generate-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve category and date
        id: ctx
        run: |
          # 날짜: 입력 없으면 오늘 KST. (아침 창은 UTC 전날 저녁 발화지만 그 시각이 KST 로는
          #  다음날 새벽이라, date +%F 가 올바른 KST 발행일을 준다.)
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Asia/Seoul date +%F)"; fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "잘못된 date 형식: '$DATE' (YYYY-MM-DD 필요)"; exit 1
          fi

          CATEGORY="${{ github.event.inputs.category }}"
          if [ -n "$CATEGORY" ]; then
            # 수동 지정 — 유효성만 검사
            case "$CATEGORY" in
              kr-daily|it-ai|global-ui-ux|electronics|health|food-travel|gaming|education|finance|mobility) ;;
              *) echo "잘못된 category: '$CATEGORY'"; exit 1 ;;
            esac
          else
            # window 판정: 예약 cron 의 UTC '시(hour)' 로 (지연에 견고 — run-time 시각이 아님).
            #   아침 창 = UTC 17~20시(>=15) → finance 제외.  오후 창 = UTC 06~08시(<15) → finance 만.
            #   수동(dispatch, cron 없음)은 window=any(전체 due).
            SCHED="${{ github.event.schedule }}"
            WINDOW="any"
            if [ -n "$SCHED" ]; then
              CH=$(echo "$SCHED" | awk '{print $2}')
              if [ "$CH" -ge 15 ]; then WINDOW="morning"; else WINDOW="afternoon"; fi
            fi

            # 오늘(KST) 전체 due — 요일별 빈도 차등
            DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 .. 7=일
            DUE=""
            case "$DOW" in 1|2|3|4|5) DUE="kr-daily it-ai finance" ;; esac                    # 매일(평일)
            case "$DOW" in 1|3|5) DUE="$DUE global-ui-ux electronics gaming mobility" ;; esac # 격일 월수금
            if [ "$DOW" = "2" ]; then DUE="$DUE health"; fi                                   # 주간 화
            if [ "$DOW" = "5" ]; then DUE="$DUE education"; fi                                # 주간 금
            DUE="$DUE food-travel"                                                            # food-travel: 매일(주말 포함)

            # 창별 그룹 필터 — 오후=finance(시장), 아침=finance 제외
            DUE_NOW=""
            for c in $DUE; do
              if [ "$WINDOW" = "afternoon" ]; then
                if [ "$c" = "finance" ]; then DUE_NOW="$DUE_NOW $c"; fi
              elif [ "$WINDOW" = "morning" ]; then
                if [ "$c" != "finance" ]; then DUE_NOW="$DUE_NOW $c"; fi
              else
                DUE_NOW="$DUE_NOW $c"
              fi
            done

            # due 중 아직 파일이 없는 첫 카테고리 선택
            PICK=""
            for c in $DUE_NOW; do
              if [ ! -f "src/content/$c/$DATE.md" ]; then PICK="$c"; break; fi
            done
            if [ -z "$PICK" ]; then
              echo "이 창($WINDOW) 의 오늘($DATE) due 가 모두 존재/없음 → 생성할 것 없음(skip)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CATEGORY="$PICK"
          fi

          GENAT="$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M:00+09:00)"
          echo "선택된 카테고리: $CATEGORY (날짜 $DATE, 생성시각 $GENAT)"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "file=src/content/$CATEGORY/$DATE.md" >> "$GITHUB_OUTPUT"
          echo "generatedAt=$GENAT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Skip if report already exists
        id: exists
        if: steps.ctx.outputs.skip == 'false'
        run: |
          if [ -f "${{ steps.ctx.outputs.file }}" ]; then
            echo "이미 존재 → skip: ${{ steps.ctx.outputs.file }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate report with Claude Code
        if: steps.exists.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            오늘(KST ${{ steps.ctx.outputs.date }})의 "${{ steps.ctx.outputs.category }}" 리포트를 생성한다.
            1. .github/prompts/${{ steps.ctx.outputs.category }}.md 를 Read 하고 그 지침을 따른다.
            2. src/content.config.ts 를 Read 해 프론트매터 스키마를 확인한다.
            3. WebSearch/WebFetch 로 조사한다.
            4. 완성된 마크다운을 정확히 이 경로에 Write 한다: ${{ steps.ctx.outputs.file }}
               - 프론트매터 date 는 ${{ steps.ctx.outputs.date }} 이고 파일명과 일치해야 한다.
               - generatedBy: claude-code, generatedAt: "${{ steps.ctx.outputs.generatedAt }}"
            git 명령은 실행하지 않는다. 파일 생성만 한다.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Verify file was created
        if: steps.exists.outputs.skip == 'false'
        run: test -f "${{ steps.ctx.outputs.file }}" || { echo "Claude 가 파일을 만들지 않음"; exit 1; }

      - name: Setup Node
        if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate with build gate
        if: steps.exists.outputs.skip == 'false'
        run: |
          npm ci
          npm run build

      - name: Quality gate (본문·출처·핵심 검사)
        if: steps.exists.outputs.skip == 'false'
        run: python3 scripts/quality-check.py "${{ steps.ctx.outputs.file }}"

      - name: Commit and push
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ai-report-bot"
          git config user.email "sunlover011@gmail.com"
          # Claude Code Action 이 원격 인증을 App 설치 토큰으로 바꾼 뒤 스텝 종료 시 revoke 하므로,
          # 워크플로 GITHUB_TOKEN 으로 원격 URL 을 명시 재설정한다 (contents:write 권한).
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add "${{ steps.ctx.outputs.file }}"
          git commit -m "[${{ steps.ctx.outputs.category }}] ${{ steps.ctx.outputs.date }} 자동 생성"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git fetch origin main
            git rebase origin/main
          done
          echo "3회 재시도 후 push 실패"; exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const cat = '${{ steps.ctx.outputs.category }}' || '(unknown)';
            const date = '${{ steps.ctx.outputs.date }}' || '(unknown)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[생성 실패] ${cat} ${date}`;
            // 같은 제목의 열린 이슈가 있으면 중복 생성하지 않음
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cron-failure',
            });
            if (existing.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              body: `카테고리: ${cat}\n날짜(KST): ${date}\n로그: ${runUrl}`,
              labels: ['cron-failure'],
            });
